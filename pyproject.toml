[project]
name = "opchjson"
version = "0.1.0"
description = "Handle JSON files easily, like in JavaScript"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [ ]

[build-system]
requires = ["uv_build>=0.11.18,<0.12"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/jribbens/opchjson"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit<5",
    "ruff<0.16",
    "ty<=0.1",
]

[tool.mypy]
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.ruff]
extend-exclude = ["test/*.py", "test/support/*.py"]
line-length = 78

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
ignore = [
  "ANN401",  # sometimes Any is unavoidable
  "COM812",  # no, we're not pointlessly adding unnecessary commas everywhere
  "D203",  # reject (not require), blank line before class docstring
  "D212",  # reject (not require), multi-line docstrings to be on the """ line
  "D413",  # no we're not going to put a pointless blank line after docstrings
  "DOC502",  # we should mention important exceptions we can throw indirectly
  "EM",  # stupid rule saying you can't use a literal in an exception message
  "FURB189",  # we have to subclass str etc
  "PLR2004",  # no, not all constants are 'magic'
  "PLR6301",  # no, you cannot magically tell when it should be a static method
  "RUF067",  # in fact, our entire module is in __init__.py
  "SIM105",  # no, we're not going to use contextlib.suppress when pass will do
  "TRY003",  # no, exceptions with messages are not bad
]
preview = true
select = ["ALL"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.pylint]
max-public-methods = 30

[tool.uv.build-backend]
module-root = ""
